name: 'Setup Android Environment'
description: 'Sets up Java and prepares the environment/keystore'

inputs:
  keystore_base64:
    description: 'Base64 encoded keystore from secrets'
    required: false

runs:
  using: "composite"
  steps:
    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '25'
        cache: 'gradle'

    - name: Prepare environment
      shell: bash
      env:
        KEYSTORE_BASE64: ${{ inputs.keystore_base64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
        fi
